[project]
name = "obb-terminal"
version = "0.2.7"
description = "Bloomberg-style desktop research terminal powered by OpenBB"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openbb-core>=1.6.10,<2",
    "openbb-yfinance==1.6.3",
    "PySide6>=6.8,<6.13",
    "pyqtgraph>=0.13.7,<0.15",
    "numpy>=2",
]

[project.scripts]
obb-terminal = "obb_terminal.app:main"
obb-terminal-alerts = "obb_terminal.alerts.checker:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "pytest-socket>=0.7",
    "ruff>=0.15,<0.16",  # must match openbb-core 1.6.13's pin
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obb_terminal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket -m 'not live and not ai'"
markers = [
    "live: calls the real network (run with -m live --force-enable-socket)",
    "ai: runs a real Claude Code analysis and uses plan quota (run with -m ai)",
]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["obb_terminal", "tests"]
